version: 2
updates:
  # npm dependencies — weekly with grouping so PRs are reviewable.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'America/Santo_Domingo'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions — pin versions stay current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
